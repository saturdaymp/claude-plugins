workflow: GitHubFlow/v1

# GitHubFlow/v1 defaults plus the Mainline strategy so every merge to
# main increments the version without needing a tag on main.
strategies:
  - Fallback
  - ConfiguredNextVersion
  - MergeMessage
  - TaggedCommit
  - TrackReleaseBranches
  - VersionInBranchName
  - Mainline

branches:
  main:
    increment: Minor
